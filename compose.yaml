services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: jongq
      POSTGRES_USER: jongq
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jongq-local-password}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - jongq-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jongq -d jongq"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  jongq-postgres: