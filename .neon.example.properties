# Copy to .neon.properties and replace every REPLACE_* value.
# In Neon Console > Connect, turn connection pooling OFF and use the direct host.
# Use the Java/JDBC URL, without embedding username or password in it.
DB_URL=jdbc:postgresql://REPLACE_HOST:5432/REPLACE_DATABASE?sslmode=require
DB_USERNAME=REPLACE_USERNAME
DB_PASSWORD=REPLACE_DATABASE_PASSWORD
# Initial admin password: 8-72 ASCII characters; an existing account is not overwritten.
ADMIN_USERNAME=admin
ADMIN_PASSWORD=REPLACE_ADMIN_PASSWORD
# Local HTTP only. Set true when the backend is served over HTTPS.
COOKIE_SECURE=false
PORT=8080
FRONTEND_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
